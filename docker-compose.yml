services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
      - ./backend/chroma_db:/app/chroma_db
      - backend_data:/app/data
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////app/data/data.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
    env_file: .env
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    restart: unless-stopped

volumes:
  backend_data:
